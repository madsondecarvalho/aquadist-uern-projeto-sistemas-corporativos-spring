# Perfil exclusivo de testes: H2 em memoria.
# Nenhum teste toca o arquivo SQLite de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:aquadist_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.indent-output=false
spring.web.resources.cache.period=0

logging.level.org.hibernate.SQL=warn
logging.level.com.aquadist=warn
