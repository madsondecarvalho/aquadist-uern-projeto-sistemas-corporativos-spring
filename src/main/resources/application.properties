spring.application.name=aquadist
server.port=8080

# ---------------------------------------------------------------------------
# Banco local SQLite (arquivo em ./data/aquadist.db)
# WAL: leitores concorrentes enquanto um escritor grava.
# SQLite continua permitindo apenas UM escritor por vez; busytimeout aguarda
# a liberacao do lock em vez de falhar imediatamente.
# Apague o arquivo (e os arquivos -wal/-shm) para recriar a base e o seed.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:./data/aquadist.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.pool-name=AquaDistSQLitePool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JSON indentado para facilitar a demonstracao
spring.jackson.serialization.indent-output=true

# Cache desabilitado para os arquivos estaticos durante o desenvolvimento
spring.web.resources.cache.period=0

logging.level.org.hibernate.SQL=warn
logging.level.com.aquadist=info
